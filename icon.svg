<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Sfondo dell'icona (stile app iOS/macOS) -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" /> <!-- Blu vivido -->
      <stop offset="100%" stop-color="#8B5CF6" /> <!-- Viola acceso -->
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Forma base dell'icona (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-gradient)" />

  <g filter="url(#shadow)">
    <!-- ========================================== -->
    <!-- PARTE 1: SVG (Vettoriale 2D) a sinistra    -->
    <!-- ========================================== -->
    <!-- Tracciato vettoriale -->
    <rect x="80" y="260" width="120" height="120" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12"/>
    
    <!-- Nodi vettoriali (Anchor points) -->
    <circle cx="80" cy="260" r="10" fill="#ffffff" />
    <circle cx="200" cy="260" r="10" fill="#ffffff" />
    <circle cx="200" cy="380" r="10" fill="#ffffff" />
    <circle cx="80" cy="380" r="10" fill="#ffffff" />

    <!-- ========================================== -->
    <!-- PARTE 2: FRECCIA DI CONVERSIONE            -->
    <!-- ========================================== -->
    <line x1="220" y1="260" x2="270" y2="210" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <polyline points="230,210 270,210 270,250" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ========================================== -->
    <!-- PARTE 3: STL (Mesh 3D isometrica) a destra -->
    <!-- ========================================== -->
    
    <!-- Faccia superiore -->
    <polygon points="370,80 450,130 370,180 290,130" fill="#ffffff" opacity="0.9"/>
    
    <!-- Faccia sinistra -->
    <polygon points="290,130 370,180 370,280 290,230" fill="#ffffff" opacity="0.6"/>
    
    <!-- Faccia destra -->
    <polygon points="450,130 450,230 370,280 370,180" fill="#ffffff" opacity="0.3"/>

    <!-- Linee di triangolazione (Mesh) tipiche dei file STL -->
    <!-- Diagonale faccia superiore -->
    <line x1="290" y1="130" x2="450" y2="130" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linejoin="round"/>
    <!-- Diagonale faccia sinistra -->
    <line x1="290" y1="230" x2="370" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linejoin="round"/>
    <!-- Diagonale faccia destra -->
    <line x1="450" y1="230" x2="370" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linejoin="round"/>
  </g>
</svg>
